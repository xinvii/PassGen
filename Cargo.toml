[package]
name = "passgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A lightweight, offline password generator built with Rust and Slint"
license = "MIT"
repository = "https://github.com/xinvii/PassGen"
publish = false

[features]
ui-qa = ["dep:png"]

[[bin]]
name = "PassGen"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "accessibility", "unstable-winit-030"] }
getrandom = "0.3"
zeroize = "1.8"
arboard = { version = "3.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
png = { version = "0.18", optional = true }

[build-dependencies]
slint-build = "=1.18.1"
find-msvc-tools = "0.1.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "deny"
